<!-- CSS Display Property -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box {
            border: 2px solid blue;
            display: inline block;
            padding: 45px;
            margin: 34px;
            width: 75px;
        }

        .box1 {
            display: none;
        }
    </style>
</head>
<body>
    <h2> </h2>
    <div class="box box1">
        I am Ivaan.
    </div>

    <div class="box">
        I am Pagu.
    </div>
    <span>My name is Shatrudhan</span>
    <span>Kumar</span>
</body>
</html>
